<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentinelX | Offensive Security AI Assistant</title>
    
    <!-- Design System & Modular Styles -->
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/components.css">

    <!-- Optional CDN Libraries for Enhanced Markdown (Gracefully falls back offline) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js" defer></script>
</head>
<body>

<div class="app-container" id="app-container">
    <!-- ============ Left Sidebar ============ -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="brand-left">
                <div class="brand-icon">
                    <!-- Custom Bespoke SentinelX Cyber Reticle Monogram -->
                    <svg width="22" height="22" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="sxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#ef4444"/>
                                <stop offset="50%" stop-color="#f43f5e"/>
                                <stop offset="100%" stop-color="#3b82f6"/>
                            </linearGradient>
                            <linearGradient id="sxFrame" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8"/>
                                <stop offset="100%" stop-color="#ef4444" stop-opacity="0.4"/>
                            </linearGradient>
                        </defs>
                        <polygon points="18,2 32,9 32,27 18,34 4,27 4,9" fill="#080c14" stroke="url(#sxFrame)" stroke-width="1.8" stroke-linejoin="round"/>
                        <line x1="18" y1="2" x2="18" y2="6" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round"/>
                        <line x1="18" y1="30" x2="18" y2="34" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round"/>
                        <path d="M10 11L14.5 11L26 25L21.5 25Z" fill="url(#sxGrad)"/>
                        <path d="M26 11L21.5 11L10 25L14.5 25Z" fill="url(#sxGrad)"/>
                        <circle cx="18" cy="18" r="4.5" stroke="#22d3ee" stroke-width="1.2" fill="#0c1017"/>
                        <circle cx="18" cy="18" r="1.6" fill="#ef4444"/>
                        <line x1="18" y1="10.5" x2="18" y2="12.5" stroke="#22d3ee" stroke-width="1.2"/>
                        <line x1="18" y1="23.5" x2="18" y2="25.5" stroke="#22d3ee" stroke-width="1.2"/>
                        <line x1="10.5" y1="18" x2="12.5" y2="18" stroke="#22d3ee" stroke-width="1.2"/>
                        <line x1="23.5" y1="18" x2="25.5" y2="18" stroke="#22d3ee" stroke-width="1.2"/>
                    </svg>
                </div>
                <div class="brand-title">
                    SentinelX
                    <span class="brand-badge">v5.0</span>
                </div>
            </div>
            <button id="btn-collapse-sidebar" class="btn-sidebar-toggle" type="button" title="Collapse Sidebar" aria-label="Collapse Sidebar">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
        </div>

        <div class="sidebar-actions">
            <button id="btn-new-chat" class="btn-new-chat" type="button">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                New Chat
            </button>
        </div>

        <div class="sessions-container">
            <div class="session-section-label">Conversations</div>
            <div id="sessions-list">
                <!-- Dynamically populated -->
            </div>
        </div>

        <div class="sidebar-footer">
            <button class="btn-icon" id="btn-open-pull-modal" style="width: 100%; justify-content: center;" type="button">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                Pull Ollama Model
            </button>
        </div>
    </aside>

    <!-- ============ Main Viewport ============ -->
    <main class="main-viewport">
        <!-- Top Navbar -->
        <header class="top-navbar">
            <div class="navbar-left">
                <!-- 3-Line Hamburger Toggle Button -->
                <button id="btn-toggle-sidebar" class="btn-hamburger" type="button" title="Toggle Sidebar" aria-label="Toggle Sidebar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <span id="active-session-title" class="active-session-title">Security Chat</span>
            </div>

            <div class="navbar-right">
                <!-- Custom Cyber Model Selector Dropdown -->
                <div class="model-dropdown-container" id="model-dropdown-container">
                    <button class="model-dropdown-trigger" id="model-dropdown-trigger" type="button" aria-haspopup="true" aria-expanded="false" title="Change active model">
                        <span id="ollama-status-dot" class="status-dot" title="Checking Ollama..."></span>
                        <span class="active-model-label mono" id="header-active-model-name">Loading...</span>
                        <svg class="dropdown-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </button>

                    <!-- Custom Dropdown Popover -->
                    <div class="model-dropdown-menu" id="model-dropdown-menu">
                        <div class="model-dropdown-header">
                            <span class="dropdown-header-title">Active AI Model</span>
                            <span class="dropdown-model-count" id="dropdown-model-count">0 available</span>
                        </div>
                        <div class="model-search-wrapper">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                            <input type="text" id="model-search-input" class="model-search-input" placeholder="Filter models...">
                        </div>
                        <div class="model-dropdown-list" id="model-dropdown-list">
                            <!-- Populated dynamically -->
                        </div>
                        <div class="model-dropdown-footer">
                            <button class="btn-pull-shortcut" id="btn-dropdown-pull-shortcut" type="button">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                                Pull Another Model
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Light / Dark Theme Switch Button -->
                <button id="btn-toggle-theme" class="btn-icon btn-theme-toggle" type="button" title="Switch Theme (Light/Dark)">
                    <!-- Sun Icon (shown in dark mode) -->
                    <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <!-- Moon Icon (shown in light mode) -->
                    <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>

                <!-- Export Session -->
                <button id="btn-export-chat" class="btn-icon" title="Export conversation as Markdown" type="button">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    Export
                </button>

                <!-- Quick Payloads Drawer Toggle -->
                <button id="btn-toggle-payloads" class="btn-icon" title="Quick Payloads & Generator" type="button">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="4 17 10 11 4 5"></polyline>
                        <line x1="12" y1="19" x2="20" y2="19"></line>
                    </svg>
                    Quick Payloads
                </button>
            </div>
        </header>

        <!-- Chat Viewport (Generous 1080px Width) -->
        <section id="chat-container" class="chat-container">
            <div id="chat-inner" class="chat-inner">
                <!-- Messages rendered dynamically -->
            </div>
        </section>

        <!-- Floating Prompt Bar (Generous 1080px Width) -->
        <footer class="prompt-area">
            <div class="prompt-inner">
                <div class="prompt-box">
                    <textarea id="prompt-input" class="prompt-textarea" placeholder="Ask SentinelX anything: exploit analysis, ROP chains, bypasses, payload syntax... (Enter to send, Shift+Enter for newline)" rows="1"></textarea>
                    <div class="prompt-toolbar">
                        <div class="prompt-meta">
                            <span>Esc: Stop</span>
                            <span>•</span>
                            <span>Model: <b id="active-model-name" class="mono" style="color:var(--accent);">--</b></span>
                        </div>
                        <div class="prompt-actions">
                            <button id="btn-stop" class="btn-stop" title="Stop generating (Esc)" type="button">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                                    <rect x="4" y="4" width="16" height="16" rx="2"></rect>
                                </svg>
                                Stop
                            </button>
                            <button id="btn-send" class="btn-send" title="Send message (Enter)" type="button">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                    <line x1="22" y1="2" x2="11" y2="13"></line>
                                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                                </svg>
                                Execute
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </footer>
    </main>
</div>

<!-- ============ Side Drawers Backdrop ============ -->
<div id="side-drawer-backdrop" class="side-drawer-backdrop"></div>

<!-- ============ Quick Payloads Drawer ============ -->
<aside id="drawer-payloads" class="side-drawer">
    <div class="drawer-header">
        <div class="drawer-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="4 17 10 11 4 5"></polyline>
                <line x1="12" y1="19" x2="20" y2="19"></line>
            </svg>
            Quick Payloads & Generators
        </div>
        <button id="btn-close-payloads" class="drawer-close-btn" type="button">&times;</button>
    </div>
    <div class="drawer-body">
        <div class="payload-config-bar">
            <div class="input-group">
                <label class="input-label" for="payload-lhost">LHOST (Tun0 / IP)</label>
                <input type="text" id="payload-lhost" class="form-input mono" placeholder="10.10.14.X">
            </div>
            <div class="input-group">
                <label class="input-label" for="payload-lport">LPORT</label>
                <input type="text" id="payload-lport" class="form-input mono" placeholder="9001">
            </div>
        </div>

        <div id="payload-tabs" class="payload-tabs-container">
            <!-- Rendered cleanly as segmented grid -->
        </div>

        <div id="payloads-list" style="display:flex;flex-direction:column;gap:12px;">
            <!-- Payloads rendered dynamically -->
        </div>
    </div>
</aside>

<!-- ============ Model Pull Modal ============ -->
<div id="modal-pull-model" class="modal-backdrop">
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-title">Pull New Model from Ollama</div>
            <button id="btn-close-pull-modal" class="drawer-close-btn" type="button">&times;</button>
        </div>
        <div class="modal-body">
            <p style="font-size:13px;color:var(--text-secondary);">
                Enter any model identifier from the Ollama library. Once downloaded, it will immediately appear in your model dropdown.
            </p>
            <div class="input-group">
                <label class="input-label" for="pull-model-input">Model Tag</label>
                <input type="text" id="pull-model-input" class="form-input mono" placeholder="e.g. qwen2.5:7b, deepseek-r1:14b, llama3.3">
            </div>
            
            <div id="pull-progress-container" class="progress-container">
                <div class="progress-bar-bg">
                    <div id="pull-progress-bar" class="progress-bar-fill"></div>
                </div>
                <div id="pull-status-text" class="progress-status-text">
                    <span>Downloading...</span>
                    <span>0%</span>
                </div>
            </div>

            <button id="btn-confirm-pull" class="form-btn" type="button">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                Download & Install Model
            </button>
        </div>
    </div>
</div>

<!-- ============ Toast Notification Container ============ -->
<div id="toast-container" class="toast-container"></div>

<!-- Application Scripts -->
<script src="/static/js/state.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/chat.js"></script>
<script src="/static/js/panels.js"></script>
<script src="/static/js/models.js"></script>
<script src="/static/js/app.js"></script>

</body>
</html>
