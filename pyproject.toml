[project]
name = "sentinelx"
version = "3.0.0"
description = "Offensive Security Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "flask>=3.0.0",
    "requests>=2.31.0",
    "ollama>=0.3.0",
    "rich>=13.7.0",
    "httpx>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[project.scripts]
sentinelx = "sentinelx.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinelx"]

[tool.ruff]
line-length = 100
target-version = "py311"
